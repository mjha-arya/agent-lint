name: New rule
description: Propose a check for a risky agent configuration
labels: ["rule"]
body:
  - type: textarea
    id: risky
    attributes: { label: Risky config, description: "Minimal snippet (redact secrets)", render: json }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why it's risky, description: "What can go wrong, ideally with a real-world example" }
    validations: { required: true }
  - type: textarea
    id: safe
    attributes: { label: Safe version, render: json }
  - type: dropdown
    id: level
    attributes: { label: Suggested level, options: [error, warning, note] }
